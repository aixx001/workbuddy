[project]
name = "module-market-demos"
version = "0.1.0"
description = "Module Market Python Demo API — 模块功能演示服务"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "ragas>=0.2.0",
    "deepeval>=1.0",
    "openai>=1.0",
    "pydantic>=2.0",
    "httpx>=0.27.0",
    "langchain-ollama>=1.0.1",
    "loguru>=0.7.3",
    "python-dotenv>=1.2.2",
    "langchain-openai>=1.1.12",
    "dspy>=3.1.3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
]
